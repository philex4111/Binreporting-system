{% extends "base.html" %}
{% block content %}
<div class="page-wrap">
  <a href="/" class="back-link">← Back</a>
  <div class="card" style="max-width:560px;">
    <div class="card-title"><span class="dot"></span> My Messages</div>
    {% if messages %}
      {% for m in messages %}
      <div class="msg-item">
        <div class="msg-meta">📨 {{ m.time }}</div>
        <div class="msg-body">{{ m.text }}</div>
      </div>
      {% endfor %}
    {% else %}
      <p style="color:#aaa; font-size:0.9rem;">No messages yet.</p>
    {% endif %}
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your Umoja Estate account</p>

    {% if error %}
      <div class="error-msg">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-dark" style="width:100%; justify-content:center; margin-top:8px;">
        Sign In →
      </button>
    </form>

    <p style="text-align:center; margin-top:24px; font-size:0.82rem; color:#aaa;">
      Umoja Estate Bin Reporting System
    </p>
  </div>
</div>
{% endblock %}
